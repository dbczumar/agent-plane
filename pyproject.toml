[project]
name = "agent-plane"
version = "0.1.4"
description = "MLflow AgentPlane — agent specification, runtime, server"
requires-python = ">=3.10"
dependencies = [
    "agent-plane-ui-sdk @ file:frontends/sdks/python",
    "alembic>=1.0,<2",
    "anyio>=4.0,<5",
    "cachetools>=5.0,<7",
    "click>=8.0,<9",
    "dbos>=1.0,<3",
    "fastapi>=0.100,<1",
    "httpx>=0.27,<1",
    "mcp>=1.0,<2",
    "prompt_toolkit>=3.0",
    "pydantic>=2.0,<3",
    "pyyaml>=6.0,<7",
    "rich>=13.0",
    "sqlalchemy>=2.0,<3",
    "tiktoken>=0.7,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
# LLM adapters (install the ones you need)
bedrock = ["boto3>=1.30,<2", "botocore>=1.30,<2"]
vertex = ["google-auth>=2.0,<3"]
litellm = ["litellm>=1.0,<2"]
# Executor backends
claude-sdk = ["claude-agent-sdk>=1.0,<2"]
agents-sdk = ["openai-agents>=0.1,<1"]
# Storage backends
databricks = ["databricks-sdk>=0.40,<1", "psycopg[binary]>=3.1,<4"]

[project.scripts]
ap = "agent_plane.cli:cli"
agent-plane-acp = "integrations.toad.__main__:main"

[tool.setuptools.packages.find]
include = ["agent_plane*", "integrations*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "cachetools"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "litellm"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "httpx"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "boto3"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "botocore.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "google.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "claude_agent_sdk.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "agent_plane.repl.*"
disallow_untyped_defs = false
disallow_untyped_decorators = false
warn_return_any = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "agent_plane_ui_sdk.*"
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "strict"
addopts = "--ignore=tests/e2e"
markers = [
    "live: end-to-end tests requiring real LLM API key (run with --llm-api-key)",
]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
