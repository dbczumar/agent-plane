[project]
name = "agent-plane"
version = "0.1.0"
description = "MLflow AgentPlane — agent specification, runtime, server"
requires-python = ">=3.10"
dependencies = [
    "cachetools>=5.0",
    "click>=8.0",
    "dbos>=1.0",
    "fastapi",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "tiktoken>=0.7",
    "alembic",
    "uvicorn[standard]",
]

[project.scripts]
ap = "agent_plane.cli:cli"
agent-plane-acp = "integrations.toad.__main__:main"

[tool.setuptools.packages.find]
include = ["agent_plane*", "integrations*"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = "cachetools"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
addopts = "--ignore=tests/e2e"
markers = [
    "live: end-to-end tests requiring real LLM API key (run with --llm-api-key)",
]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
