[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-plane-ui-sdk"
version = "0.1.0"
description = "Python SDK for building agent-plane frontends"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
repl = ["rich>=13", "prompt_toolkit>=3"]
