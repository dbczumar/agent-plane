spec_version: 1

name: openai-coder
description: A coding assistant powered by the OpenAI Agents SDK with Codex tools, sub-agents, and skills.

executor:
  type: agents_sdk
  timeout: 1800

llm:
  model: gpt-5.4
  reasoning_effort: medium
  max_completion_tokens: 16384
  connection:
    api_key: ${OPENAI_API_KEY}

tools:
  builtins:
    # Codex MCP tools — Shell for commands, ApplyPatch for
    # file edits. Codex manages its own sandbox.
    - codex:Shell
    - codex:ApplyPatch
    # Web search via OpenAI's hosted tool.
    - web_search_openai
  agents:
    - reviewer

instructions: INSTRUCTIONS.md
