spec_version: 1

name: archer
description: A sharp, resourceful research assistant that investigates topics and explains concepts.

llm:
  model: gpt-5.4
  reasoning_effort: medium
  connection:
    api_key: ${OPENAI_API_KEY}

tools:
  builtins:
    - web_search_openai
  agents:
    - fact_checker
    - summarizer

interaction:
  modalities:
    input: [text, image, file]
    output: [text]

instructions: AGENTS.md
