bundle:
  name: agent-plane-server

variables:
  lakebase_branch:
    description: >
      Full Lakebase Postgres branch resource name, e.g.
      projects/my-project/branches/production
  lakebase_database:
    description: >
      Full Lakebase Postgres database resource name, e.g.
      projects/my-project/branches/production/databases/my-db
  volume_name:
    description: >
      Full UC Volume name (catalog.schema.volume), e.g.
      home_corey_zumar.agent_plane.artifacts

resources:
  apps:
    agent-plane:
      name: "agent-plane"
      description: "Agent-plane server backed by Lakebase + UC Volumes"
      source_code_path: ./
      resources:
        # Lakebase Postgres — provides PGHOST, PGPORT, PGDATABASE,
        # PGUSER, PGSSLMODE environment variables at runtime.
        - name: postgres
          postgres:
            branch: ${var.lakebase_branch}
            database: ${var.lakebase_database}
            permission: CAN_CONNECT_AND_CREATE
        # UC Volume for artifact storage — provides the volume
        # path as an environment variable at runtime.
        - name: artifact_volume
          uc_securable:
            securable_full_name: ${var.volume_name}
            securable_type: VOLUME
            permission: WRITE_VOLUME
