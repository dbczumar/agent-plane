spec_version: 1

name: researcher
description: |
  Test-fixture sub-agent. Returns a fixed marker string so the
  E2E suite has an unambiguous substring to assert on.

llm:
  model: gpt-5.4
  connection:
    api_key: ${OPENAI_API_KEY}

tools:
  timeout: 60

interaction:
  modalities:
    input: [text]
    output: [text]

instructions: AGENTS.md
